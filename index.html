<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAYLOAD TRACKING // U.S. Supply-Chain &amp; Aviation Command</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <script src="https://jsdelivr.net"></script>
  <link href="https://googleapis.com" rel="stylesheet">
    <script>
    const HUB_META = {
      PORT_NOLA: { lat: 29.93, lon: -90.06, latStr: '29.93° N', lonStr: '90.06° W' },
      MSY:       { lat: 29.99, lon: -90.25, latStr: '29.99° N', lonStr: '90.25° W' },
      PORT_MIA:  { lat: 25.77, lon: -80.17, latStr: '25.77° N', lonStr: '80.17° W' },
      SDF:       { lat: 38.17, lon: -85.73, latStr: '38.17° N', lonStr: '85.73° W' }
    };

    let allHubs = [];
    let currentFilter = 'all';
    let selectedHubCode = 'PORT_NOLA';
    let map, markersLayer;

    function toggleModal() {
      document.getElementById('method-modal').classList.toggle('hidden');
    }

    function initMap() {
      map = L.map('corridor-map', { zoomControl: true, attributionControl: false }).setView([31.8, -85.8], 5);
      L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      const p1 = L.latLng(29.93, -90.06);
      const p2 = L.latLng(38.17, -85.73);
      const p3 = L.latLng(25.77, -80.17);
      const lineStyle = { color: '#22d3ee', weight: 1.5, opacity: 0.35, dashArray: '6, 8' };

      L.polyline([p1, p2], lineStyle).addTo(map);
      L.polyline([p2, p3], lineStyle).addTo(map);
      L.polyline([p1, p3], lineStyle).addTo(map);
    }

    function renderMap(hubs) {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      hubs.forEach(hub => {
        const meta = HUB_META[hub.hub_code];
        if (!meta) return;
        const isPort = hub.hub_type === 'seaport';
        const color = isPort ? '#22d3ee' : '#10b981';

        const pulseIcon = L.divIcon({
          className: 'custom-radar-pin',
          html: `
            <div style="position:relative; width:24px; height:24px; display:flex; align-items:center; justify-content:center;">
              <div class="radar-ring" style="position:absolute; width:22px; height:22px; border-radius:50%; background:${color}; opacity:0.5;"></div>
              <div style="width:11px; height:11px; border-radius:50%; background:${color}; border:2px solid #fff; box-shadow:0 0 10px ${color};"></div>
            </div>
          `,
          iconSize: L.point(24, 24),
          iconAnchor: L.point(12, 12)
        });

        const marker = L.marker(L.latLng(meta.lat, meta.lon), { icon: pulseIcon });
        marker.on('click', () => selectHub(hub.hub_code));
        marker.bindTooltip(`${hub.hub_code} // ${hub.status.toUpperCase()}`, { direction: 'top' });
        marker.addTo(markersLayer);
      });
    }

    function selectHub(code) {
      selectedHubCode = code;
      const hub = allHubs.find(h => h.hub_code === code) || allHubs.at(0);
      if (!hub) return;

      document.getElementById('inspector-code').textContent = hub.hub_code;
      const meta = HUB_META[hub.hub_code] || { latStr: '--', lonStr: '--' };
      const isPort = hub.hub_type === 'seaport';
      const isAlert = hub.status.includes('Delay') || hub.status.includes('High');

      const metricsHtml = isPort
        ? `
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-[#05070b] border border-slate-800 p-3 rounded">
              <div class="text-[10px] font-mono text-slate-400">ACTIVE VESSELS</div>
              <div class="text-2xl font-bold font-mono text-cyan-400 mt-1">${hub.primary_metric ?? 0}</div>
            </div>
            <div class="bg-[#05070b] border border-slate-800 p-3 rounded">
              <div class="text-[10px] font-mono text-slate-400">BERTHED / IDLE</div>
              <div class="text-2xl font-bold font-mono text-white mt-1">${hub.secondary_metric ?? 0}</div>
            </div>
          </div>
        `
        : `
          <div class="bg-[#05070b] border border-slate-800 p-3 rounded">
            <div class="text-[10px] font-mono text-slate-400">FAA AIRSPACE &amp; RUNWAY FLOW</div>
            <div class="text-base font-bold font-mono ${isAlert ? 'text-amber-400' : 'text-emerald-400'} mt-1">${hub.status.toUpperCase()}</div>
          </div>
        `;

      document.getElementById('inspector-body').innerHTML = `
        <div>
          <div class="flex items-center justify-between text-[11px] font-mono text-slate-400">
            <span>${hub.region.toUpperCase()}</span>
            <span>${meta.latStr}, ${meta.lonStr}</span>
          </div>
          <h3 class="font-display font-bold text-lg text-white mt-1">${hub.hub_name}</h3>
        </div>
        ${metricsHtml}
        <div class="bg-[#05070b] border border-slate-800 p-3 rounded text-xs font-mono space-y-1.5">
          <div class="flex justify-between">
            <span class="text-slate-500">CONDITIONS:</span>
            <span class="text-slate-200">${hub.weather_summary || 'NOMINAL'}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-500">CADENCE:</span>
            <span class="text-emerald-400">AUTOMATED 30M</span>
          </div>
        </div>
      `;
      renderCards();
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = 'filter-btn px-3 py-1 rounded text-slate-400 hover:text-white transition';
      });
      const active = document.getElementById('btn-' + type);
      if (active) active.className = 'filter-btn px-3 py-1 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 transition';
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('hubs-grid');
      grid.innerHTML = '';
      const filtered = currentFilter === 'all' ? allHubs : allHubs.filter(h => h.hub_type === currentFilter);

      filtered.forEach(hub => {
        const isPort = hub.hub_type === 'seaport';
        const isSelected = hub.hub_code === selectedHubCode;
        const borderClass = isSelected ? 'border-cyan-400 ring-1 ring-cyan-400/40' : 'border-slate-800 hover:border-slate-600';
        const badgeColor = isPort ? 'text-cyan-300 bg-cyan-500/10 border-cyan-500/30' : 'text-emerald-300 bg-emerald-500/10 border-emerald-500/30';

        const card = document.createElement('div');
        card.onclick = () => selectHub(hub.hub_code);
        card.className = `glass-panel rounded-lg p-4 cursor-pointer transition-all ${borderClass}`;
        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-[10px] font-mono px-2 py-0.5 rounded border ${badgeColor}">${hub.hub_code}</span>
            <span class="text-[10px] font-mono text-slate-400">${hub.region.toUpperCase()}</span>
          </div>
          <h4 class="font-display font-bold text-sm text-white truncate">${hub.hub_name}</h4>
          <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-baseline justify-between font-mono">
            <span class="text-[11px] text-slate-400">${isPort ? 'ACTIVE SHIPS' : 'AIRSPACE'}</span>
            <span class="text-base font-bold ${isPort ? 'text-cyan-400' : 'text-emerald-400'}">
              ${isPort ? (hub.primary_metric ?? 0) : 'CLEAR'}
            </span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderApexChart(ports) {
      const el = document.querySelector('#apex-vessel-chart');
      if (!el) return;
      el.innerHTML = '';
      const options = {
        chart: { type: 'bar', height: 220, toolbar: { show: false }, background: 'transparent', fontFamily: 'IBM Plex Mono' },
        theme: { mode: 'dark' },
        series: [
          { name: 'Active Underway', data: ports.map(p => Math.max(0, (p.primary_metric || 0) - (p.secondary_metric || 0))) },
          { name: 'Berthed / Stationary', data: ports.map(p => p.secondary_metric || 0) }
        ],
        colors: ['#22d3ee', '#3b82f6'],
        plotOptions: { bar: { horizontal: true, stacked: true, barHeight: '45%', borderRadius: 2 } },
        xaxis: { categories: ports.map(p => p.hub_name), labels: { style: { colors: '#94a3b8', fontSize: '11px' } } },
        yaxis: { labels: { style: { colors: '#e2e8f0', fontSize: '11px' } } },
        grid: { borderColor: '#1e293b', strokeDashArray: 4 },
        legend: { position: 'top', labels: { colors: '#cbd5e1' } }
      };
      new ApexCharts(el, options).render();
    }

    async function loadTelemetry() {
      initMap();
      try {
        const res = await fetch('./live.json?t=' + Date.now());
        if (!res.ok) throw new Error('Feed unavailable');
        const data = await res.json();

        const dt = new Date(data.updated_at);
        const timeStr = dt.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).toUpperCase();
        document.getElementById('last-updated').textContent = timeStr;

        const diesel = data.macro?.diesel_price_usd;
        const tsi = data.macro?.freight_tsi;
        document.getElementById('top-diesel').textContent = diesel ? `$${Number(diesel).toFixed(2)}/GAL` : 'N/A';
        document.getElementById('top-tsi').textContent = tsi ? Number(tsi).toFixed(1) : 'N/A';

        allHubs = data.hubs || [];
        const ports = allHubs.filter(h => h.hub_type === 'seaport');
        const airports = allHubs.filter(h => h.hub_type === 'airport');
        const totalVessels = ports.reduce((s, p) => s + (p.primary_metric || 0), 0);
        const clearAir = airports.filter(a => !a.status.includes('Delay')).length;

        document.getElementById('top-vessels').textContent = totalVessels;
        document.getElementById('top-faa').textContent = `${clearAir}/${airports.length} OPTIMAL`;

        const logBox = document.getElementById('event-log');
        logBox.innerHTML = `
          <div class="text-emerald-400">&gt; [${timeStr}] Snapshot verified &amp; archived</div>
          <div>&gt; AISStream: ${totalVessels} commercial vessels across ${ports.length} ports</div>
          <div>&gt; FAA NAS: ${clearAir}/${airports.length} monitored air terminals normal</div>
> FRED Macro: Diesel $${diesel ? Number(diesel).toFixed(2) : '--'} | TSI ${tsi ? Number(tsi).toFixed(1) : '--'}
`;
renderMap(allHubs);
renderApexChart(ports);
selectHub(allHubs.at(0)?.hub_code || 'PORT_NOLA');
} catch (err) {
document.getElementById('last-updated').textContent = 'SYNC PENDING';
}
}
loadTelemetry();
